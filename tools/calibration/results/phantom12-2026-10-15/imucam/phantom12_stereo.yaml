%YAML:1.0
# phantom12_stereo.yaml -- phantom12 head: one OAK board (19443010F1BC622E00), OV9282 pair at
# 1280x800, left = socket B = DMA queue 1, right = socket D = DMA queue 2 (the bottom camera is
# removed from /etc/phantom/head_camera.json), and the NeckPitch IMU. Written by tools/calibration
# step 70 on 2026-10-15 from okvis-template-phantom12.yaml (= phantom21's mk12_stereo_holevisor.yaml
# at AI-1184 with dma_queue 1, 2); only T_SC, intrinsics, distortion and image_delay come from here.
# Stereo: calib_stereo3noedge (Kalibr, pinhole-equi; 1103 pairs from three takes, pairs with any
#   corner beyond 450 px left out). Held-out row error 0.204 px; scale +0.21 %; scale within
#   +-1 % from 0.4 to 2.1 m on 722 unused pairs; baseline 44.83 mm.
# Camera-IMU: calib_imucam-B-loose (Kalibr, stereo pose held fixed). Take B, 180 s, robot swung by
#   hand on its gantry, fixed exposure 1500 us / ISO 1600; left/right exposure delay +0.04 ms.
#   Reprojection 0.29 / 0.26 px; normalized gyro / accel residuals 1.00 / 1.22 (IMU noise
#   imu-phantom12-neckpitch-loose.yaml). timeshift_cam_imu +5.61 / +5.60 ms -> image_delay
#   -0.0056 s on host-clock capture stamps (no rebase anywhere).
#   Repeatability: take C 4.4 mm / 0.08 deg / 0.02 ms; five fits of three takes within
#   1.6-7.8 mm, 0.07-0.31 deg, 0.11 ms.
# T_BS and imu_parameters are phantom21's and UNVERIFIED on phantom12. With them the cameras look
#   30 deg down in the Head frame (phantom21: ~10 deg); phantom12's T_SC differs from phantom21's
#   by ~20 deg and ~106 mm. Measure T_BS before trusting camera-in-Head (T_BC = T_BS * T_SC).
# Evidence: tools/calibration/results/phantom12-2026-10-15/ on the stereo-depth-eval work branch.
cameras:
    - {T_SC:
        [0.9999310416240091, -0.01174230193306174, 0.0001741896564461527, -0.06715974055272894,
          0.0006213336777105115, 0.06771080251868256, 0.9977047966040538, 0.1469818711181323,
          -0.01172714548321717, -0.9976358882716622, 0.06771342917934865, 0.01590309574857512,
          0, 0, 0, 1],
        image_dimension: [1280, 800],
        distortion_coefficients: [-0.01237955833390107, 0.01738601890953348, 0.01164880669217011, -0.02523499765495942],
        distortion_type: equidistant,
        focal_length: [562.9142084808391, 561.6780260943772],
        principal_point: [642.752387266093, 384.2237952142237],
        cam_model: pinhole,
        mapping_rectification: true,
        mapping: true,
        camera_type: rgb+depth, #gray, rgb, gray+depth, rgb+depth
        slam_use: okvis, #none, okvis, okvis-depth, okvis-virtual
        dma_queue: 1} # OKVIS cam0 = phantom12 queue 1 (left, socket B)

    - {T_SC:
        [0.9996148717885609, -0.02775070394529625, -8.080642760114247e-05, -0.02233449796698593,
          0.001791329126282664, 0.06161957175290618, 0.9980981011488548, 0.1472594987832361,
          -0.02769294565588055, -0.9977138501632263, 0.06164555096169944, 0.01541871475241956,
          0, 0, 0, 1],
        image_dimension: [1280, 800],
        distortion_coefficients: [-0.01206696273086, 0.03146984862246962, -0.06059374788285483, 0.04222150055208412],
        distortion_type: equidistant,
        focal_length: [565.3641845975487, 563.7718970072081],
        principal_point: [641.3470474091959, 383.5724131913916],
        cam_model: pinhole,
        camera_type: rgb, #gray, rgb, gray+depth, rgb+depth
        mapping: true,
        mapping_rectification: true,
        slam_use: okvis, #none, okvis, okvis-depth, okvis-virtual
        dma_queue: 2} # OKVIS cam1 = phantom12 queue 2 (right, socket D)

# additional camera parameters
camera_parameters:
    timestamp_tolerance: 0.005 # [s] stereo frame out-of-sync tolerance
    sync_cameras: [0, 1] # the cameras that will be synchronised
    image_delay: -0.0056 # [s] timestamp_camera_correct = timestamp_camera - image_delay
    online_calibration: # some parameters to set the online
        do_extrinsics: true # Do we online-calibrate extrinsics?
        do_extrinsics_final_ba: true # Do we calibrate extrinsics in final BA?
        sigma_r: 0.01 # T_SCi position prior stdev [m]
        sigma_alpha: 0.1 # T_SCi orientation prior stdev [rad]
        sigma_r_final_ba: 0.03 # T_SCi position prior stdev in final BA [m]
        sigma_alpha_final_ba: 0.3 # T_SCi orientation prior stdev in final BA [rad]
    deep_stereo_indices: [0, 1] # [left, right] camera indices for the stereo network
    fov_scale: 1.0 # Divisor for new focal length which is only used when fisheye stereo rectification for dense mapping.
    stereo_network_type: tensorrt # torch | tensorrt
    stereo_network_file: s2m2_M_512x320_thor_fp16_pinned.engine # filename in modelDir; extension must match backend
    stereo_network_width: 512  # rectified-image width fed to the stereo network; must match the engine
    stereo_network_height: 320 # rectified-image height fed to the stereo network; must match the engine

imu_parameters:
    use: true
    a_max: 78.0 # acceleration saturation [m/s^2] -- the neck IMU clips at 78.41 (measured 2026-09-15); was 176, so the saturation handling never fired
    g_max: 7.8 # gyro saturation [rad/s]
    sigma_g_c: 0.0026405873915791738 # gyro noise density [rad/s/sqrt(Hz)]
    sigma_a_c: 0.010935292495321242 # accelerometer noise density [m/s^2/sqrt(Hz)]
    sigma_bg: 0.01 # gyro bias prior [rad/s]
    sigma_ba: 0.1 # accelerometer bias prior [m/s^2]
    sigma_gw_c: 3.916835278254409e-04 # gyro drift noise density [rad/s^s/sqrt(Hz)]
    sigma_aw_c: 0.0012028682743073398 # accelerometer drift noise density [m/s^2/sqrt(Hz)]
    g: 9.81007 # Earth's acceleration due to gravity [m/s^2]
    g0: [ 0.0, 0.0, 0.0 ] # initial gyro bias [rad/s]
    a0: [ 0.0, 0.0, 0.0 ] # initial accelerometer bias [m/s^2]
    s_a: [ 1.0,  1.0, 1.0 ] # scale factor for accelerometer measurements: a_true = s_a * a_meas + b_a
    # transform Body-Sensor (IMU): T_BS = Body_T_Sensor = IMU pose in the body
    # frame. Body frame := the "Head" URDF link (see dma:body_frame), so this is
    # head_T_IMU (derived from the CAD Head->cam1 + calibrated cam-IMU T_SC).
    T_BS:
        [-0.00188426, 0.831282, 0.555847, 0.0110568,
         -0.999996, -0.00262363, 0.000533834, -0.0457738,
         0.0019021, -0.555844, 0.831284, 0.0826725,
         0.0, 0.0, 0.0, 1.0]

# frontend: detection etc.
frontend_parameters:
    feature_type: superpoint # brisk | orb | superpoint
    keyframe_overlap: 0.60
    use_cnn: false
    parallelise_detection: true
    num_matching_threads: 8
    resize_factor: 0.5  # 1280x800 -> 640x400 for the whole VIO incl. SuperPoint
    serialize_gpu_inference: 0  # 1 = SuperPoint detect + s2m2 never run on the GPU at once; detect has priority. 0 = off

    brisk:
        detection_threshold: 38.0
        absolute_threshold: 50.0
        matching_threshold: 60.0
        octaves: 0
        max_num_keypoints: 500
        rotation_invariance: true
        scale_invariance: false
        vocabulary: small_voc.yml.gz
        p_dbow: 0.4

    orb:
        n_features: 1000
        scale_factor: 1.2
        n_levels: 4
        ini_fast_threshold: 20
        min_fast_threshold: 10
        ratio_test: 0.6
        check_orientation: true
        nms_radius: 4       # greedy spatial NMS on keypoints (px); 0 disables
        vocabulary: ORBvoc.txt
        p_dbow: 0.010

    superpoint:
        # Static fixed-top-K, batch-1 engine. Input size MUST match the VIO
        # frame size (resize_factor*raw = 0.5*1280x800 = 640x400). Detection is
        # per-camera (parallelise_detection); batching was removed.
        # Re-export: export_superpoint_topk.py --width 640 --height 400 --batch 1
        engine: superpoint_640x400_topk512_thor.engine
        # lightglue | bruteforce. bruteforce = cuBLAS cosine, no engine,
        # preferred on Thor. (SuperPoint is the only feature type with a
        # matcher choice, so it lives here.)
        matcher: bruteforce
        score_threshold: 0.2
        p_dbow: 0.075
        # Loop-closure distinctiveness floor (sum of per-dim std-dev over the
        # RANSAC-inlier 256-float descriptors). Rejects an LC when below this
        # AND inliers < 20. Observed good LCs ~14; these descriptors top out
        # ~16, so 20 effectively requires >=20 inliers. 0 = off (log-only).
        lc_distinctiveness: 12.0
        # Final keypoint cap, applied in C++ AFTER score-threshold + greedy NMS
        # (post-processing). The engine's 1024 candidates are thinned to at most
        # this many well-spread points.
        max_keypoints: 300
        # C++ greedy NMS radius in pixels, applied to the engine's 1024
        # candidates. 0 disables. Mirrors BRISK's uniformity-radius selection;
        # ~0.3 ms for ~1024 candidates at radius=16.
        nms_radius: 8


    # Brute-force (cuBLAS cosine) matcher, used when matcher=bruteforce.
    # min_cossim is also reused as the loop-closure verification floor.
    bruteforce:
        min_cossim: 0.80     # accept a match if cosine >= this
        max_ratio: 1.0       # Lowe ratio (top1/top2); 1.0 disables
        cross_check: 1        # 1 = mutual nearest-neighbour check, 0 = off

    lightglue:
        engine: lightglue.engine
        min_score: 0.20

# estimator parameters
estimator_parameters:
    num_keyframes: 5 # number of keyframes in optimisation window
    num_loop_closure_frames: 5 # number of loop closure frames in optimisation window
    num_imu_frames: 3 # number of frames linked by most recent nonlinear IMU error terms
    do_loop_closures: true # whether to do VI-SLAM or VIO
    # OFF on the robot (#358 shutdown): the final full BA is the one optimisation with no time
    # budget -- setOptimisationTimeLimit() applies to realtimeGraph_ only, the fullGraph_ line
    # beside it commented out as "\todo Fix hack!". So a graceful stop ran an unbounded solve
    # against `docker stop -t 60`, and 3 of the 5 graceful shutdowns in the preserved run logs
    # were SIGKILLed mid-BA. Measured cost of turning it off, live vs final-BA trajectory on the
    # same stamps: median 0.16-0.48 m raw, but only 0.08-0.23 m RMS once a rigid alignment is
    # removed -- i.e. most of what it changes is a global transform, which ATE scoring discards
    # anyway, and the remainder sits inside the 0.677 m within-arm repeatability floor (#342).
    # The live trajectory is written BEFORE the BA and already carries loop closures, so nothing
    # is lost from the saved output except this last global refinement.
    # Left true in the benchmark configs (euroc/, replica/, hilti22/), where it is the point.
    do_final_ba: false # Whether to run a full final BA
    enforce_realtime: true # whether to limit the time budget for optimisation
    realtime_min_iterations: 3 # minimum number of iterations always performed
    realtime_max_iterations: 10 # never do more than these, even if not converged
    realtime_time_limit: 0.015 # time budget for realtime optimisation [s]. Charged to the solve
                               # alone (#499): 15 ms on Thor is 3-4 Gauss-Newton rounds, what the
                               # robot ran on before when a dead override clamped this to 10 ms.
    realtime_num_threads: 5 # number of threads for the realtime optimisation
    full_graph_iterations: 15 # don't do more than these for the full (background) optimisation
    full_graph_num_threads: 3 # number of threads for the full (background) optimisation
    drift_percentage_heuristic: 10.0 # % allowed drift in loop closures rel. to dist. travelled.

# some options for how and what to output
output_parameters:
    display_topview: false # Displays top view of the trajectory. Might become slow for long sequences.
    display_matches: false # displays debug video and matches. May be slow.
    display_overhead: false # debug overhead image. Is slow.
    enable_submapping: true # Enable volumetric submapping

    # ---- 3D Gaussian Splatting (see docs/gaussian_splatting.md) ----
    # Export a 3DGS-trainable dataset: raw images + per-image OPENCV intrinsics +
    # per-image camera pose in the METRIC, gravity-aligned OKVIS world frame W.
    # Poses are exported verbatim (no re-estimation, no recentring, no rescaling)
    # and resolved AFTER the final BA, so every frame carries a globally
    # consistent pose. Costs a lossless PNG write per frame while enabled.
    # OFF since 2026-09-18. Nobody is training a splat off this robot, and while it was on
    # every run paid a lossless PNG per frame and the console grew a 3DGS fold whose two
    # buttons controlled something no one used (#387 hides that fold when there is no
    # producer -- this is what makes there be no producer). Flip to true to bring the whole
    # thing back: setupGsWriter returns nullptr on false, so every gs_* below is inert
    # until it does, and they are left in place as the recipe rather than deleted.
    export_gs_dataset: false            # master switch for the export
    # gs_dataset_path: ""               # default: <savePath>/gs_dataset
    gs_write_colmap: true               # also emit a COLMAP cameras/images/points3D triplet
    gs_start_paused: true               # start with the export PAUSED; the console's EXPORT
                                        # button turns it on. Nothing is written to disk until
                                        # then, matching liveviz's serving default (#271).
    gs_frame_stride: 2                  # keep every Nth frame (thins an oversampled traverse). 2 halves
                                        # the PNG writes and still leaves ~6.6 frames/s of overlapping
                                        # views, which is what a splat needs.
    gs_max_images: 2000                 # cap exported PNGs kept on disk; 0 = unlimited.
                                        # NOTHING else bounds them: the stream carries paths,
                                        # not pixels, and the trainer's window lives on another
                                        # machine, where fetching an image does not consume it.
                                        # Left at 0 this reached 297,935 images / 129 GB on
                                        # 2026-09-01. Sized as CONSUMER SLACK, not a training
                                        # set: ~880 MB, ~4.4 min at 7.5 frames/s. Must exceed
                                        # any consumer's window (600 by default).
    # LIVE streaming: train a splat WHILE the run happens, offboard.
    #   gs_stream_dir: /dev/shm/gs-stream   # then, on the training machine:
    #                                       #   app/gs/train_gs_stream.py /dev/shm/gs-stream
    # Requires export_gs_dataset: the stream REFERENCES the PNGs the export writes
    # rather than carrying pixels, so the images must be going to disk anyway.
    # ONE camera per stream (gs_stream_camera): the stream advertises a single
    # intrinsics set and this rig's two cameras differ by 2.6 px of principal point,
    # so mixing them would put a systematic reprojection error on every second frame.
    # Do not run the trainer on Thor -- serialize_gpu_inference already exists
    # because SuperPoint and the stereo network cannot share that GPU.
    # Live stream for app/gs/train_gs_stream.py. The pod runs hostIPC, so this IS
    # the host's /dev/shm and the trainer can reach it (served over liveviz's /gs
    # route). NB the comment goes ABOVE, not trailing -- this is a STRING parameter
    # and OpenCV's FileStorage would swallow a trailing comment into the value.
    gs_stream_dir: /dev/shm/gs-stream
    gs_export_camera: 0                 # export ONLY this camera. The stream carries one; exporting
                                        # the other was half of 5.3 GB and half the PNG encodes for
                                        # pixels nothing downstream reads.
    gs_async_image_write: true          # PNG encode on a writer thread, NOT the image-callback thread
                                        # that feeds the estimator. Measured 28.84 ms/frame inline vs a
                                        # 0.20 ms clone. Leave this on for anything realtime.
    gs_stream_camera: 0                 # which camera to stream
    gs_stream_seed_every: 200           # republish the landmark seed cloud every N streamed frames.
                                        # Seeding is not cosmetic: measured 2.45x registration
                                        # confidence against 0.70x for the trainer's random init.
    gs_seed_from_depth: true            # seed the gaussians from the stereo network's depth, not just
                                        # the sparse landmarks. Measured -- median surface agreement
                                        # 8.0 -> 5.2 cm and far-field junk 14.7 -> 3.0 %, at matched
                                        # gaussian count. The single biggest quality lever here.
    gs_seed_depth_voxel: 0.1            # 10 cm, not the 5 cm default -- a room-sized space fills the
                                        # 400k-point cap at 5 cm and burns a mid-run re-bin.
    # Size of the trainer's ROLLING WINDOW, not a guess at the run length. The
    # trainer PREALLOCATES this many slots at startup, so it is a straight memory
    # cost -- capacity x 640 x 400 x 3 bytes. 4000 is ~10 min of travel at 6.65
    # frames/s and costs 3.1 GB; the old 12000 cost 9.2 GB before a single frame
    # arrived, on the same laptop that is training and rendering.
    #
    # Overshooting is no longer free and undershooting no longer drops frames --
    # the window evicts the least distinct viewpoint instead, so this now trades
    # MEMORY against how much of the traverse stays trainable. It also no longer
    # touches the densification schedule (that coupling was a bug, since fixed).
    gs_stream_capacity_hint: 4000
    gs_keyframes_only: false            # export only keyframes
    gs_max_angular_rate: 0.0            # drop frames above this body rate [rad/s]; 0 = off. MUST have a
                                        # decimal point (the parser demands a real).
                                        # Motion blur / rolling-shutter skew is the top 3DGS
                                        # quality risk on a walking rig; ~1.0 is a sane start.
    gs_write_seed_pointcloud: true      # dump OKVIS landmarks as a metric sparse seed (points3d.ply)

# Absolute path to directory containing neural-network .pt files
# (depth-model.pt, depth-model-rgb.pt, fast-scnn.pt, mvs-model.pt, etc.).
# If omitted, the apps fall back to <executable_dir>/../models/.
model_dir: /okvis-models

# Live-robot breakpoints (#435). false = OKVIS_DEBUG_BREAK sites are inert and cost one
# relaxed atomic load. true = a tripped site FREEZES every OKVIS thread, zeroes the
# velocity command (the head is held), publishes the state to liveviz -- which turns red
# -- and waits for resume / next / skip. A freeze outlives the estimator's IMU buffer at
# 8 s and resets tracking, so look fast. Arming on the robot is an edit to the HOST copy
# (/etc/phantomos/okvis/) plus an OKVIS restart; only ADDING a breakpoint costs a new image.
debug_mode: false

# DMA shared-memory transport settings — consumed only by okvis2x_app_dma_live.
# Per-camera queues live in the `dma_queue` field of each cameras: entry above;
# this section holds the non-per-camera knobs. Env vars OKVIS_DMA_IMU_NAME /
# OKVIS_DMA_IMU_SHM / OKVIS_DMA_IMU_INDEX override these at runtime.
dma:
    # IMU to use, by RobotConfigData name (empty -> slot 0).
    imu_name: "NeckPitch"
    # shm queue the raw IMU frames are published on.
    imu_shm: "/raw_imu_actuals"
    # shm queue carrying RobotConfigData (imu_names[]).
    config_shm: "/config"
    # Robot URDF: the TF tree is built in-process from this via forward
    # kinematics (joint angles come from the DMA /actuals queue). Override with
    # OKVIS_URDF. Path is resolved relative to the process working directory.
    urdf: "/etc/okvis/20250206_phantom_mk1.urdf"
    # URDF link that the OKVIS body frame (imu_parameters:T_BS) is expressed in.
    # The FrameBridge looks this link up in the TF tree to map the OKVIS pose
    # (T_WB = world->body = world->this link) into the robot_frame for planning.
    body_frame: "Head"
    # Target frame for all OKVIS outputs (pose + map): the robot root/base link.
    # The FrameBridge re-expresses world->body into this frame via the TF tree,
    # so downstream planning / obstacle avoidance runs in the pelvis frame.
    robot_frame: "Pelvis"
