# calibd runtime per robot (calibtool M2). One entry per bot name of robots.yaml:
#   python, pydeps   the robot-side interpreter and the folder holding dma_ipc (M2: the hand-made kit venv; the CI-built
#                    calib image replaces both, design plan 10.3)
#   root             the robot folder calibd keeps its kit, lock and sessions under (M2 read-only runs: /tmp/calibtool-m2,
#                    the only folder the agent may write; a real session: /data/calib)
#   left, right      DMA camera queues of the LEFT / RIGHT head camera (verified live in preflight, never trusted from
#                    head_camera.json)
#   producer         namespace / deployment of the camera producer
#   motor_tool       the fixed dma_motor_motion (with the 'targets' signal)
#   stand            the operator's board stand for the placement guidance: how far the board can go up / down from
#                    its height at the start of a placement (m); default 0.30 / 0.40
#   placement_timeout_s  a placement (the trial's and the full session's PLACE) gives up ("Skipping this one.") after
#                    this long; default 180; null or 0 = no limit, only the operator's C skips
profiles:
  P10:
    python: /root/p11-cal/venv/bin/python
    pydeps: /root/p11-cal/pydeps
    root: /tmp/calibtool-m2
    left: 3
    right: 0
    producer: {namespace: dma-video, deployment: producer}
    motor_tool: /root/p11-cal/dma_motor_motion
    # chair-shaped frame; its height changes only in coarse steps: from the usual height up ~30 cm or down ~40 cm
    # (operator, 9 Nov trial)
    # the operator decides reachability (10 Nov); steps: the seat has fixed positions, asked for as whole steps
    stand: {raise_max_m: 0.30, lower_max_m: 0.40, auto_skip: false, steps: true}
    # 10 Nov: "Skipping this one." after 3 minutes came while the operator was still trying; only their C skips
    placement_timeout_s: null
