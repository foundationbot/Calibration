# rig-p11.yaml -- P11 (Thor phantom11 since 9 Nov 2026; phantom07 before) head: queue 3 = LEFT (ego_left, socket B),
# queue 0 = RIGHT (ego_right, socket D), board 1944301091064E2E00. Written 10 Nov 2026 for calibtool from
# rig-phantom11.yaml (P10's, same head design); nominal focal / baseline from the live stand-in
# phantom07_stereo_dense_thor-STANDIN-p12fitc-refitA-yawA2-1280x800-15fps.yaml (564.9 px, 44.3 mm).
rig_name: p11
okvis_yaml_name: phantom11_p11_stereo_kb4t-1280x800.yaml
target: target-aprilgrid.yaml
target_measured: true
cameras:
  model: pinhole-equi
  resolution: [1280, 800]
  nominal_focal_px: 565.0
  nominal_baseline_m: 0.0443
  kalibr:
    - {record_dir: cam3, dma_queue: 3, side: left}
    - {record_dir: cam0, dma_queue: 0, side: right}
  okvis_order: [0, 1]
imu:
  name: NeckPitch
  index: 0
  kalibr_yaml: imu-phantom12-neckpitch.yaml
  T_BS_default_file: null
robot:
  host: root@phantom11
  display_imu_dir: /path/unused
  vio_tuner_tools: /path/unused
  body_axes: {forward: 0, left: 1, up: 2}
capture:
  pair_tol_ms: 10
  calib_pairs: 450
  heldout_pairs: 25
gates:
  coverage_grid: [16, 10]
  coverage_min: 0.60
  reach_min_deg: 60.0
  epipolar_max_px: 0.5
  degenerate_disparity_px: 1.0
  t_sc_range_m: [0.05, 0.40]
  scale_max_pct: 0.5
  lens_hold_rms_max_px: 1.8
  lens_hold_max_z_m: 1.3
  lens_bad_hold_max_frac: 0.20
  lens_repeat_max_pct: 0.5
  lens_pass_pct: 0.5
  lens_pass_corner_pct: 1.0
  lens_min_holds: 8
