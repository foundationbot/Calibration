# rig-phantom15.yaml -- phantom15 head: ego_left = queue 3 (socket C), ego_right = queue 0 (socket D, FSYNC master),
# 1280x800 for calibration (producer args --width 1280 --height 800). Exposure 2000 us ISO 400 (head_camera.json).
# rig-phantom15.yaml -- phantom15 (P7) head: queue 3 = LEFT (ego_left, socket C), queue 0 = RIGHT (ego_right, socket D). Written 2026-11-04 by Margaret (via Claude) from rig-phantom09.yaml for the KB4T fit of the
# 2026-11-04 13:48-14:00 takes on terminus (~/margaret/calib/phantom15-2026-11-04/). 1280x800.
rig_name: phantom15
okvis_yaml_name: phantom15_stereo_kb4t-1280x800.yaml
target: target-aprilgrid.yaml
target_measured: true
cameras:
  model: pinhole-equi
  resolution: [1280, 800]
  nominal_focal_px: 570.0
  nominal_baseline_m: 0.0435      # 4 Nov KB4T fits: 43.4-43.5 mm (the old config's 38.8 mm was wrong)
  kalibr:
    - {record_dir: cam3, dma_queue: 3, side: left}
    - {record_dir: cam0, dma_queue: 0, side: right}
  okvis_order: [0, 1]
imu:
  name: NeckPitch
  index: 0
  kalibr_yaml: imu-phantom12-neckpitch.yaml
  T_BS_default_file: null
robot:
  host: root@phantom15
  display_imu_dir: /path/unused
  vio_tuner_tools: /path/unused
  body_axes: {forward: 0, left: 1, up: 2}
capture:
  pair_tol_ms: 10
  calib_pairs: 450
  heldout_pairs: 25
gates:
  coverage_grid: [16, 10]
  coverage_min: 0.60
  reach_min_deg: 60.0
  epipolar_max_px: 0.5
  degenerate_disparity_px: 1.0
  t_sc_range_m: [0.05, 0.40]
  scale_max_pct: 0.5
  lens_hold_rms_max_px: 1.8
  lens_hold_max_z_m: 1.3
  lens_bad_hold_max_frac: 0.20
  lens_repeat_max_pct: 0.5
  lens_pass_pct: 0.5
  lens_pass_corner_pct: 1.0
  lens_min_holds: 8
