# rig-phantom09.yaml — phantom09 (P05) head: socket B = queue 1 = LEFT, socket D = queue 2 = RIGHT (calib_meta.json of
# Margaret 4 Nov record-app takes on terminus ~/margaret/calib/phantom09-2026-11-04/raw). 1280x800 25 fps.

rig_name: phantom09
okvis_yaml_name: phantom09_stereo_kb4t-1280x800.yaml

target: target-aprilgrid.yaml
# The same 7x5 board phantom12 measured on 2026-10-14 (pitch 0.120 m); phantom21's calibrations used it.
target_measured: true

cameras:
  model: pinhole-equi
  resolution: [1280, 800]
  nominal_focal_px: 570.0      # kalibr equi 4 Nov: fx 571, fy 569
  nominal_baseline_m: 0.0422      # kalibr equi 4 Nov: 42.15 mm
  kalibr:
    - {record_dir: cam1, dma_queue: 1, side: left}
    - {record_dir: cam2, dma_queue: 2, side: right}
  okvis_order: [0, 1]

imu:
  name: NeckPitch
  index: 2                       # NOT read on phantom21: unused by the drift check; re-read before any IMU take
  kalibr_yaml: imu-phantom12-neckpitch.yaml   # placeholder (phantom12's noise file); unused by the drift check
  T_BS_default_file: null

robot:
  host: root@phantom09
  display_imu_dir: /path/unused
  vio_tuner_tools: /path/unused
  body_axes: {forward: 0, left: 1, up: 2}

capture:
  pair_tol_ms: 10
  calib_pairs: 450
  heldout_pairs: 25

gates:
  coverage_grid: [16, 10]
  coverage_min: 0.60
  reach_min_deg: 60.0
  epipolar_max_px: 0.5
  degenerate_disparity_px: 1.0
  t_sc_range_m: [0.05, 0.40]
  scale_max_pct: 0.5
  lens_hold_rms_max_px: 1.8
  lens_hold_max_z_m: 1.3
  lens_bad_hold_max_frac: 0.20
  lens_repeat_max_pct: 0.5
  lens_pass_pct: 0.5
  lens_pass_corner_pct: 1.0
  lens_min_holds: 8
